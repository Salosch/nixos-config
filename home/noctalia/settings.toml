config_version = 16

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.69999998435378075
    border = "primary"
    border_width = 0.5
    capsule = true
    center = [ "workspaces" ]
    compositor_blur = false
    concave_edge_corners = false
    end = [ "tray", "w-engine-widget", "volume", "clock" ]
    margin_ends = 0
    start = [ "launcher" ]
    thickness = 27

[control_center]
hidden_tabs = [ "power", "network" ]
shortcuts = []

    [control_center.calendar]
    show_week_numbers = true

[dock]
auto_hide = true
background_opacity = 0.29999999329447746
concave_edge_corners = false
enabled = true
icon_size = 38
item_spacing = 10
launcher_position = "start"
main_axis_padding = 13
reserve_space = false
show_dots = true
show_instance_count = false

[idle]
pre_action_fade_seconds = 0

[location]
address = "Mannheim"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.69999998435378075

[plugins]
enabled = [ "tadomika_ari/w-engine" ]

[shell]
settings_expand_all_groups = true
settings_window_translucent = true

    [shell.launcher]
    auto_paste = "off"
    search_position = "top"
    show_app_origin_indicator = false

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/milas/Pictures/screenshots"

[theme]
builtin = "Dracula"
community_palette = "Neon Surf"
custom_palette = "Velvet Room"
source = "custom"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "claude-code", "discord", "prismlauncher", "steam", "fastfetch" ]

        [theme.templates.user.spotify]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/spotify.css"
        output_path = "$XDG_CONFIG_HOME/spicetify/noctalia.css"

[wallpaper.default]
path = "/nix/store/03006ykkcgjn028icaafd4q87yv62pmj-noctalia-5.3.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/home/milas/.local/share/Steam/steamapps/workshop/content/431960/911842176/preview.jpg"

[wallpaper.monitors.DP-2]
path = "/home/milas/.local/share/Steam/steamapps/workshop/content/431960/911842176/preview.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/milas/.local/share/Steam/steamapps/workshop/content/431960/911842176/preview.jpg"

[widget.bluetooth]
enabled = false

[widget.control-center]
glyph = "settings"

[widget.launcher]
glyph = "noctalia"

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.workspaces]
empty_color = "tertiary"
focused_output_only = true
pill_scale = 0.5
scale = 1.1000000000000001
show_all_outputs = true
show_labels = false