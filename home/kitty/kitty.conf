# Linked to ~/.config/kitty/kitty.conf. Replace this with your own kitty.conf;
# changes apply to new windows (or press ctrl+shift+F5 to reload).

font_family           JetBrainsMono Nerd Font
font_size             12.0

window_padding_width  10
background_opacity 0.7
background_blur 32

confirm_os_window_close 0
enable_audio_bell     no
include themes/noctalia.conf
